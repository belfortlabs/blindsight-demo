[project]
name = "personnet-dataset"
version = "0.1.0"
description = "Wake Vision, centre-cropped and labelled from Open Images boxes, for PersonNet and its samples"
requires-python = ">=3.12"
dependencies = [
    # Wake Vision from Hugging Face: one parquet file per split by default (huggingface_hub,
    # read with the pyarrow that datasets brings), streamed with --full (datasets).
    # huggingface_hub also brings the `hf auth login` command.
    "datasets>=3.0",
    "huggingface_hub>=0.30",
    # ../model/preprocess.py, the crop and resize the cache is built with, and the loader.
    # The same torch release as ../model and ../eml, so the cache, the training
    # and the compiled model agree. Named explicitly so that on Linux it comes from the CPU
    # index below: nothing here needs a GPU, and PyPI's Linux build brings several GB of CUDA.
    "torch==2.13.0",
    "pillow>=10",
    "numpy>=1.26",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
