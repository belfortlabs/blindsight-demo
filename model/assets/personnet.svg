<svg xmlns="http://www.w3.org/2000/svg" width="680" height="708" viewBox="0 0 680 708" role="img" font-family="Helvetica, Arial, sans-serif">
  <title>PersonNet at 64x64, strides 2,2,2,1</title>
  <desc>Encrypted 3x64x64 input passes through three stride-2 and one stride-1 Conv3x3-BatchNorm-ReLU blocks (16, 32, 64, 64 channels), global average pooling over an 8x8 map and a Linear 64 to 2 layer producing two logits, index 1 meaning a near person.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .th { font-size: 14px; font-weight: 500; }
      .ts { font-size: 12px; font-weight: 400; }
      .arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
      .leader { stroke: #B4B2A9; stroke-width: 0.75; stroke-dasharray: 3 3; fill: none; }
      .teal rect { fill: #E1F5EE; stroke: #0F6E56; }
      .teal .th { fill: #085041; } .teal .ts { fill: #0F6E56; }
      .purple rect { fill: #EEEDFE; stroke: #534AB7; }
      .purple .th { fill: #3C3489; } .purple .ts { fill: #534AB7; }
      .gray rect { fill: #F1EFE8; stroke: #5F5E5A; }
      .gray .th { fill: #444441; } .gray .ts { fill: #5F5E5A; }
      .tensor rect { fill: #FFFFFF; stroke: #B4B2A9; }
      .tensor .th { fill: #2C2C2A; } .tensor .ts { fill: #5F5E5A; }
      .legend { fill: #5F5E5A; }
    </style>
  </defs>

  <rect width="680" height="708" fill="#FFFFFF"/>

  <text x="40" y="34" font-size="16" font-weight="500" fill="#2C2C2A">PersonNet · 3×64×64 input · strides (2, 2, 2, 1)</text>
  <text x="40" y="54" class="ts" fill="#5F5E5A">60,642 params (BN folded) · 5.16M MACs · 32,768 ReLU · 4 non-linear layers · RF 31 px</text>

  <rect x="32" y="152" width="304" height="336" rx="8" fill="none" stroke="#888780" stroke-width="0.75" stroke-dasharray="4 4"/>
  <text class="ts" x="44" y="170" fill="#5F5E5A">self.features</text>

  <g class="gray"><rect x="48" y="80" width="272" height="52" rx="4" stroke-width="0.75"/><text class="th" x="184" y="102" text-anchor="middle">Input image</text><text class="ts" x="184" y="120" text-anchor="middle">Centre-crop, resize, encrypt</text></g>
  <g class="teal"><rect x="48" y="180" width="272" height="52" rx="4" stroke-width="0.75"/><text class="th" x="184" y="202" text-anchor="middle">Conv 3×3 /2 · BN · ReLU</text><text class="ts" x="184" y="220" text-anchor="middle">3→16 · 448 params · 0.44M MACs</text></g>
  <g class="teal"><rect x="48" y="260" width="272" height="52" rx="4" stroke-width="0.75"/><text class="th" x="184" y="282" text-anchor="middle">Conv 3×3 /2 · BN · ReLU</text><text class="ts" x="184" y="300" text-anchor="middle">16→32 · 4.6k params · 1.18M MACs</text></g>
  <g class="teal"><rect x="48" y="340" width="272" height="52" rx="4" stroke-width="0.75"/><text class="th" x="184" y="362" text-anchor="middle">Conv 3×3 /2 · BN · ReLU</text><text class="ts" x="184" y="380" text-anchor="middle">32→64 · 18.5k params · 1.18M MACs</text></g>
  <g class="teal"><rect x="48" y="420" width="272" height="52" rx="4" stroke-width="2"/><text class="th" x="184" y="442" text-anchor="middle">Conv 3×3 stride 1 · BN · ReLU</text><text class="ts" x="184" y="460" text-anchor="middle">64→64 · 36.9k params · 2.36M MACs</text></g>
  <g class="purple"><rect x="48" y="516" width="272" height="52" rx="4" stroke-width="0.75"/><text class="th" x="184" y="538" text-anchor="middle">AdaptiveAvgPool2d + flatten</text><text class="ts" x="184" y="556" text-anchor="middle">Mean over 8×8 · no params</text></g>
  <g class="purple"><rect x="48" y="596" width="272" height="52" rx="4" stroke-width="0.75"/><text class="th" x="184" y="618" text-anchor="middle">Linear 64 → 2</text><text class="ts" x="184" y="636" text-anchor="middle">130 params · 128 MACs</text></g>

  <line class="arr" x1="184" y1="132" x2="184" y2="178" marker-end="url(#arrow)"/>
  <line class="arr" x1="184" y1="232" x2="184" y2="258" marker-end="url(#arrow)"/>
  <line class="arr" x1="184" y1="312" x2="184" y2="338" marker-end="url(#arrow)"/>
  <line class="arr" x1="184" y1="392" x2="184" y2="418" marker-end="url(#arrow)"/>
  <line class="arr" x1="184" y1="472" x2="184" y2="514" marker-end="url(#arrow)"/>
  <line class="arr" x1="184" y1="568" x2="184" y2="594" marker-end="url(#arrow)"/>

  <g class="tensor"><rect x="392" y="80" width="232" height="52" rx="4" stroke-width="0.75"/><text class="th" x="508" y="102" text-anchor="middle">3 × 64 × 64</text><text class="ts" x="508" y="120" text-anchor="middle">12,288 values · encrypted</text></g>
  <g class="tensor"><rect x="392" y="180" width="232" height="52" rx="4" stroke-width="0.75"/><text class="th" x="508" y="202" text-anchor="middle">16 × 32 × 32</text><text class="ts" x="508" y="220" text-anchor="middle">16,384 values (peak)</text></g>
  <g class="tensor"><rect x="392" y="260" width="232" height="52" rx="4" stroke-width="0.75"/><text class="th" x="508" y="282" text-anchor="middle">32 × 16 × 16</text><text class="ts" x="508" y="300" text-anchor="middle">8,192 values</text></g>
  <g class="tensor"><rect x="392" y="340" width="232" height="52" rx="4" stroke-width="0.75"/><text class="th" x="508" y="362" text-anchor="middle">64 × 8 × 8</text><text class="ts" x="508" y="380" text-anchor="middle">4,096 values</text></g>
  <g class="tensor"><rect x="392" y="420" width="232" height="52" rx="4" stroke-width="0.75"/><text class="th" x="508" y="442" text-anchor="middle">64 × 8 × 8</text><text class="ts" x="508" y="460" text-anchor="middle">4,096 values · same size</text></g>
  <g class="tensor"><rect x="392" y="516" width="232" height="52" rx="4" stroke-width="0.75"/><text class="th" x="508" y="538" text-anchor="middle">64</text><text class="ts" x="508" y="556" text-anchor="middle">feature vector</text></g>
  <g class="tensor"><rect x="392" y="596" width="232" height="52" rx="4" stroke-width="0.75"/><text class="th" x="508" y="618" text-anchor="middle">2 logits</text><text class="ts" x="508" y="636" text-anchor="middle">index 1 = near person</text></g>

  <line class="leader" x1="320" y1="106" x2="392" y2="106"/>
  <line class="leader" x1="320" y1="206" x2="392" y2="206"/>
  <line class="leader" x1="320" y1="286" x2="392" y2="286"/>
  <line class="leader" x1="320" y1="366" x2="392" y2="366"/>
  <line class="leader" x1="320" y1="446" x2="392" y2="446"/>
  <line class="leader" x1="320" y1="542" x2="392" y2="542"/>
  <line class="leader" x1="320" y1="622" x2="392" y2="622"/>

  <g class="teal"><rect x="48" y="668" width="12" height="12" rx="2" stroke-width="0.75"/></g><text class="ts legend" x="68" y="678">Non-linear (ReLU)</text>
  <g class="purple"><rect x="210" y="668" width="12" height="12" rx="2" stroke-width="0.75"/></g><text class="ts legend" x="230" y="678">Linear only</text>
  <g class="tensor"><rect x="340" y="668" width="12" height="12" rx="2" stroke-width="0.75"/></g><text class="ts legend" x="360" y="678">Output tensor (C × H × W)</text>
</svg>
